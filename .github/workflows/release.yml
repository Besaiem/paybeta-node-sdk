name: Release

on:
  push:
    branches:
      - main
    # conventional-changelog-conventionalcommits has no concept of a
    # commit type that skips a release — every commit bumps at least a
    # patch (see its whatBump: `level` starts at 2/patch and is only ever
    # raised to minor/major, never suppressed). Since tooling-only changes
    # still use real commit types for commitlint/changelog purposes, the
    # only actual way to stop them from publishing an empty-content patch
    # release is to stop the workflow from running at all for these paths.
    paths-ignore:
      - '.github/**'
      - '.husky/**'
      - '.release-it.json'
      - 'commitlint.config.js'

# Only one release job runs at a time; queued runs wait rather than cancel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version bump & changelog
    runs-on: ubuntu-latest

    # Skip commits created by the release process itself to prevent loops.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    permissions:
      contents: write   # push release commit + tag
      id-token: write   # mint the OIDC token npm's trusted-publishing flow exchanges for a publish grant — no NPM_TOKEN secret needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history required for conventional-changelog
          ref: main              # actions/checkout defaults to a detached HEAD at the pushed SHA; .release-it.json's requireBranch: "main" needs an actual branch checked out
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # npm's OIDC trusted-publishing flow requires npm CLI >= 11.5.1,
          # which ships by default with Node 24+ — older Node versions would
          # need a manual `npm install -g npm@latest` step first.
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Release (version bump, changelog, git tag, GitHub release, npm publish)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci
